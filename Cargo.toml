[workspace]
members = ["crates/devdoctor-core", "crates/devdoctor-cli", "crates/devdoctor-mcp"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/example/devdoctor"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tempfile = "3"
assert_cmd = "2"
