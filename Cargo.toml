[workspace]
members = ["crates/devdoctor-core", "crates/devdoctor-cli", "crates/devdoctor-mcp"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Bannawat01/DevDoctor"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tempfile = "3"
assert_cmd = "2"
rmcp = { version = "3.9", features = ["server", "macros", "schemars", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
