<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">DevDoctor local developer diagnostics</title>
  <desc id="desc">A local-first diagnostic flow from a project to evidence-backed findings.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1280" height="640" rx="28" fill="url(#bg)"/>
  <circle cx="1110" cy="90" r="180" fill="#38bdf8" opacity=".08"/>
  <circle cx="180" cy="590" r="240" fill="#a78bfa" opacity=".08"/>
  <text x="80" y="108" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="700">DevDoctor</text>
  <text x="84" y="154" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="25">Local-first diagnostics for projects that fail to build, start, or connect.</text>
  <rect x="80" y="205" width="1120" height="300" rx="22" fill="#0f172a" stroke="#334155" filter="url(#shadow)"/>
  <text x="120" y="252" fill="#94a3b8" font-family="Consolas, monospace" font-size="18">devdoctor doctor --path ./example-app</text>
  <line x1="120" y1="275" x2="1160" y2="275" stroke="#334155"/>
  <text x="120" y="320" fill="#4ade80" font-family="Consolas, monospace" font-size="21">PASS</text>
  <text x="220" y="320" fill="#e2e8f0" font-family="Consolas, monospace" font-size="21">Rust toolchain available</text>
  <text x="120" y="365" fill="#facc15" font-family="Consolas, monospace" font-size="21">WARN</text>
  <text x="220" y="365" fill="#e2e8f0" font-family="Consolas, monospace" font-size="21">DATABASE_URL port differs from Compose mapping</text>
  <text x="120" y="410" fill="#f87171" font-family="Consolas, monospace" font-size="21">ERROR</text>
  <text x="220" y="410" fill="#e2e8f0" font-family="Consolas, monospace" font-size="21">Host port 5432 is already occupied</text>
  <rect x="120" y="445" width="280" height="4" rx="2" fill="url(#accent)"/>
  <text x="120" y="542" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="20">Rust • Node • Docker • Ports • Environment • MCP / Zed</text>
  <text x="120" y="578" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="17">Read-only · no telemetry · no automatic environment changes</text>
</svg>
