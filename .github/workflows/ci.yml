name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    name: Windows (supported)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Release build
        run: cargo build --workspace --release
      - name: CLI install smoke test
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "devdoctor-cli-install"
          cargo install --path crates/devdoctor-cli --locked --root $root
          $bin = Join-Path $root "bin/devdoctor.exe"
          & $bin --version
          & $bin doctor --path $env:RUNNER_TEMP
          if ($LASTEXITCODE -gt 1) { exit $LASTEXITCODE }

  linux-experimental:
    name: Linux (experimental)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Release build
        run: cargo build --workspace --release
      - name: CLI install smoke test
        shell: bash
        run: |
          root="$RUNNER_TEMP/devdoctor-cli-install"
          cargo install --path crates/devdoctor-cli --locked --root "$root"
          "$root/bin/devdoctor" --version
          "$root/bin/devdoctor" doctor --path "$RUNNER_TEMP"
