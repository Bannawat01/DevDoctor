name: Bug report
description: Report a reproducible DevDoctor problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not paste secrets, tokens, connection strings, or private filesystem paths. Redact diagnostic output before sharing.
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, DevDoctor version, and sanitized command output only.
    validations:
      required: true
