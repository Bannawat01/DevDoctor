[package]
name = "devdoctor-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Read-only local MCP server for DevDoctor diagnostics."
repository.workspace = true
readme = "../../README.md"

[[bin]]
name = "devdoctor-mcp"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
rmcp.workspace = true
tokio.workspace = true
devdoctor-core = { version = "0.1.0", path = "../devdoctor-core" }

[dev-dependencies]
tempfile.workspace = true
rmcp = { workspace = true, features = ["client", "transport-async-rw"] }
tokio = { workspace = true, features = ["io-util"] }
